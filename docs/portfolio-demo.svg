<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Local RAG grounded-answer demo</title>
  <desc id="description">A deterministic portfolio preview showing a question, grounded answer, verified python.org URL, and evidence excerpt.</desc>
  <rect width="1200" height="760" rx="28" fill="#0e1117"/>
  <rect x="40" y="36" width="1120" height="688" rx="22" fill="#161b22" stroke="#30363d"/>
  <text x="86" y="102" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">📚 Local RAG Chatbot</text>
  <text x="86" y="142" fill="#9da7b3" font-family="Segoe UI, Arial, sans-serif" font-size="18">Private local inference · bounded retrieval retry · verified sources</text>
  <rect x="86" y="174" width="1028" height="66" rx="12" fill="#12251d" stroke="#238636"/>
  <circle cx="119" cy="207" r="13" fill="#3fb950"/>
  <path d="M112 207l5 5 10-12" fill="none" stroke="#0e1117" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="147" y="213" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="18">Portfolio preview: deterministic answer from the included sample corpus.</text>
  <text x="86" y="296" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">YOU</text>
  <rect x="86" y="312" width="1028" height="64" rx="14" fill="#21262d"/>
  <text x="116" y="353" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="21">Who created Python?</text>
  <text x="86" y="432" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">LOCAL ASSISTANT</text>
  <rect x="86" y="448" width="1028" height="208" rx="14" fill="#1c2128" stroke="#30363d"/>
  <text x="116" y="492" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="20">Python was created by Guido van Rossum while he was working at CWI</text>
  <text x="116" y="524" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="20">in the Netherlands.</text>
  <text x="116" y="570" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">SOURCE · Who Created Python?</text>
  <text x="116" y="600" fill="#79c0ff" font-family="Consolas, monospace" font-size="15">https://www.python.org/about/help/</text>
  <text x="116" y="632" fill="#b1bac4" font-family="Segoe UI, Arial, sans-serif" font-size="16">“Python was created by Guido van Rossum, who developed it while working at CWI.”</text>
  <text x="86" y="694" fill="#6e7681" font-family="Segoe UI, Arial, sans-serif" font-size="14">Deterministic UI preview · run: streamlit run portfolio_demo.py</text>
